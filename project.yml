name: DesktopCleaner

options:
  bundleIdPrefix: com.desktopcleaner
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "4"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  DesktopCleanerCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DesktopCleanerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desktopcleaner.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  DesktopCleanerServices:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DesktopCleanerServices
    dependencies:
      - target: DesktopCleanerCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desktopcleaner.services
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  DesktopCleaner:
    type: application
    platform: macOS
    sources:
      - path: Sources/DesktopCleaner
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: DesktopCleanerCore
      - target: DesktopCleanerServices
      - package: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Desktop Cleaner
        CFBundleName: Desktop Cleaner
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026"
        SUAllowsAutomaticUpdates: false
        SUEnableAutomaticChecks: false
        SUFeedURL: https://github.com/shortcutchris/desktop-download-cleaner/releases/latest/download/appcast.xml
        SUPublicEDKey: uV8qxotHQIQEaUQMU/VSAvfSWOrQnEvScSMiPp6H+M4=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desktopcleaner.app
        PRODUCT_NAME: DesktopCleaner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Resources/DesktopCleaner.entitlements

  DesktopCleanerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DesktopCleanerTests
    dependencies:
      - target: DesktopCleanerCore
      - target: DesktopCleanerServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desktopcleaner.tests
        GENERATE_INFOPLIST_FILE: YES

  DesktopCleanerIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DesktopCleanerIntegrationTests
    dependencies:
      - target: DesktopCleanerCore
      - target: DesktopCleanerServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desktopcleaner.integration-tests
        GENERATE_INFOPLIST_FILE: YES

  DesktopCleanerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/DesktopCleanerUITests
    dependencies:
      - target: DesktopCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desktopcleaner.ui-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DesktopCleaner:
    build:
      targets:
        DesktopCleaner: all
        DesktopCleanerCore: [test]
        DesktopCleanerServices: [test]
        DesktopCleanerTests: [test]
        DesktopCleanerIntegrationTests: [test]
        DesktopCleanerUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: DesktopCleanerTests
          parallelizable: true
        - name: DesktopCleanerIntegrationTests
          parallelizable: false
        - name: DesktopCleanerUITests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
